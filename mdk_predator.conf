# MDK-Predator Configuration
# Configuration file for Mayhem-MDK Predator Security Suite

[General]
# Default security module on startup
default_module=automotive

# Enable debug logging
enable_logging=true

# Buffer size for signal capture (bytes)
buffer_size=1048576

[Hardware]
# HackRF One configuration
sample_rate=2000000
baseband_filter_bandwidth=1750000

# RF amplifier settings
enable_amp=false
enable_antenna_power=false

[HardwareInterface]
# MDK Hardware Interface Configuration

# Enable I2C communication (ESP32-S3 compatible)
enable_i2c=true
i2c_speed=400000
i2c_sda_pin=21
i2c_scl_pin=22

# Enable DMA for fast data transfers
enable_dma=true
max_dma_buffer_size=2097152

# Enable parallel stream processing for hardware acceleration
enable_parallel_streams=true
parallel_stream_count=4

# Enable GPIO and UART interfaces
enable_gpio=true
enable_uart=true

[ParallelAcceleration]
# Parallel stream processing for 4x+ performance

# Number of parallel streams for signal processing
num_streams=4

# Enable hardware acceleration
enable_acceleration=true

# Synchronized stream operation
synchronized_streams=true

# Base frequency for parallel operations (Hz)
base_frequency=433920000

# DMA channels for parallel streams (comma-separated)
stream_dma_channels=0,1,2,3

# Buffer size per stream (bytes)
stream_buffer_size=524288

# Examples of parallel acceleration usage:
# - Automotive key fob bruteforce: 4x faster with 4 parallel streams
# - WiFi handshake analysis: Process multiple captures simultaneously
# - Crypto analysis: Parallel key testing for rolling codes
# - SubGHz spectrum scanning: Multi-frequency simultaneous capture

[Automotive]
# Default frequency for key fob analysis (Hz)
default_frequency=433920000

# Supported frequencies (Hz)
frequencies=315000000,433920000,868000000,915000000

# Rolling code detection timeout (ms)
rolling_code_timeout=5000

[Wireless]
# WiFi channels to scan (comma-separated)
wifi_channels=1,6,11

# Bluetooth scan duration (seconds)
bluetooth_scan_duration=10

# SubGHz frequency range
subghz_freq_min=300000000
subghz_freq_max=928000000

[Crypto]
# Enable cryptographic analysis
enable_crypto_analysis=true

# Maximum key length to analyze (bits)
max_key_length=256

[Security]
# Transmit mode (for testing only)
# WARNING: Only enable for authorized security research
allow_transmit=false

# Require confirmation before transmit
require_transmit_confirmation=true

[Logging]
# Log file path
log_path=/tmp/mdk_predator.log

# Log level (0=ERROR, 1=WARNING, 2=INFO, 3=DEBUG)
log_level=2
