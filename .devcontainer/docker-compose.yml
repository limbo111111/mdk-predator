version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: mdk-predator-dev:latest
    
    volumes:
      # Mount the workspace
      - ../:/workspace:cached
      # Keep command history
      - devcontainer-bashhistory:/home/vscode/commandhistory
      # Persist mayhem-firmware between sessions
      - mayhem-firmware:/workspace/mayhem-firmware
      
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    
    # Uncomment to connect as a non-root user. More info: https://aka.ms/vscode-remote/containers/non-root.
    user: vscode
    
    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    
    environment:
      # Set to 1 to enable clean builds
      - CLEAN_BUILD=0
      # Set to 1 to update mayhem firmware from git
      - UPDATE_FIRMWARE=0

volumes:
  # Persist bash history
  devcontainer-bashhistory:
  # Persist mayhem-firmware to avoid re-downloading
  mayhem-firmware:
